<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mesamese</title>
<style>
  html,body{margin:0;height:100%;background:#161616;font-family:system-ui;color:#eee;overflow:hidden}
  #board{position:fixed;inset:0}
  .card{position:absolute;width:240px;height:150px;border-radius:10px;overflow:hidden;
        background:#2a2a2a;box-shadow:0 10px 28px rgba(0,0,0,.55);cursor:pointer;
        display:flex;flex-direction:column;border:1px solid #333;user-select:none}
  .card:hover{box-shadow:0 12px 36px rgba(80,140,255,.4)}
  .card .thumb{flex:1;background-size:cover;background-position:top left;background-color:#222}
  .card .bar{height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;
             background:#1f1f1f;font-size:12px;white-space:nowrap;overflow:hidden}
  .card .bar img{width:14px;height:14px;flex:0 0 14px}
  .card .bar span{overflow:hidden;text-overflow:ellipsis}
  #bar{position:fixed;right:12px;top:10px;z-index:20;display:flex;gap:8px}
  #bar button{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:6px;
               padding:6px 10px;font-size:12px;cursor:pointer}
  #bar button:hover{background:#333}
  #status{position:fixed;left:12px;bottom:8px;font-size:12px;color:#777;z-index:10;pointer-events:none}
</style>
</head>
<body>
<div id="board"></div>
<div id="bar">
  <button id="cap">Capture all</button>
  <button id="dl">Download logs</button>
</div>
<div id="status">click a card &rarr; tab opens at 90% over the blurred map &middot; Esc to return</div>
<script type="module" src="spike.js"></script>
</body>
</html>
